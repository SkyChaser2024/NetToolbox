name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows AMD64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Verify Go modules
        run: go mod verify

      - name: Check Go formatting
        shell: pwsh
        run: |
          $goFiles = @(git ls-files '*.go')
          $unformatted = @(gofmt -l $goFiles)
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }
          if ($unformatted.Count -gt 0) {
            throw "Run gofmt on: $($unformatted -join ', ')"
          }

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high --registry=https://registry.npmjs.org

      - name: Check application versions
        run: npm --prefix frontend run check:version

      - name: Check frontend formatting
        run: npm --prefix frontend run format:check

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Vet Go code
        run: go vet ./...

      - name: Audit Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.14.0 build -clean -trimpath -s -ldflags "-s -w -buildid="

      - name: Prepare release executable
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath 'frontend/package.json' | ConvertFrom-Json).version
          $archive = "build/bin/NetToolbox-v$version-windows-x64.zip"
          Compress-Archive -LiteralPath 'build/bin/NetToolbox.exe' -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $archive)) {
            throw 'Release archive was not created'
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-toolbox-windows-amd64
          path: |
            build/bin/NetToolbox.exe
            build/bin/NetToolbox-v*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' frontend/package.json)
          tag="v$version"

          previous_version=''
          if [[ "$PREVIOUS_SHA" != '0000000000000000000000000000000000000000' ]]; then
            if ! git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$PREVIOUS_SHA"
            fi
            previous_version=$(git show "$PREVIOUS_SHA:frontend/package.json" | jq -r '.version')
          fi
          if [[ "$version" == "$previous_version" ]]; then
            echo "Application version is unchanged ($version); skipping Release."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Download Windows executable
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: network-toolbox-windows-amd64
          path: release

      - name: Ensure release tag
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tag_commit=$(git rev-parse "$TAG^{commit}")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG points to $tag_commit instead of $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          archive="release/NetToolbox-${tag}-windows-x64.zip"
          notes=".github/release-notes/${tag}.md"

          if [[ ! -f "$archive" ]]; then
            echo "Expected release archive not found: $archive" >&2
            exit 1
          fi

          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == 'false' ]]; then
              echo "Release $tag is already published; preserving its assets. Use a new version tag for changes."
              exit 0
            fi
          else
            notes_args=(--generate-notes)
            if [[ -f "$notes" ]]; then
              notes_args=(--notes-file "$notes")
            fi
            gh release create "$tag" --draft --verify-tag \
              --target "$GITHUB_SHA" \
              --title "NetToolbox $tag" \
              "${notes_args[@]}"
          fi

          gh release upload "$tag" "$archive" --clobber
          edit_args=(--draft=false --title "NetToolbox $tag" --latest)
          if [[ -f "$notes" ]]; then
            edit_args+=(--notes-file "$notes")
          fi
          gh release edit "$tag" "${edit_args[@]}"
